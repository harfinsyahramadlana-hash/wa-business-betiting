<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>WA Business UMKM — Desa Betiting.fig</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --figma-bar:#2c2c2c;
    --figma-bar-2:#242424;
    --figma-canvas:#e5e5e5;
    --figma-panel:#ffffff;
    --figma-border:#e0e0e0;
    --figma-text:#2c2c2c;
    --figma-text-dim:#8c8c8c;
    --figma-purple:#a259ff;
    --figma-blue:#0d99ff;
    --wa-teal:#075e54;
    --wa-teal-dark:#054c44;
    --wa-green:#25d366;
    --wa-bubble:#dcf8c6;
    --wa-wallpaper:#e9ddce;
    --font-ui:'Inter',sans-serif;
    --font-app:'Poppins',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:var(--font-ui);background:var(--figma-canvas);overflow:hidden;}

  /* ===== TOP TOOLBAR ===== */
  .topbar{
    height:48px;background:var(--figma-bar);display:flex;align-items:center;
    padding:0 14px;color:#fff;gap:14px;position:relative;z-index:50;
    box-shadow:0 1px 0 rgba(0,0,0,.3);
  }
  .topbar .brand{display:flex;align-items:center;gap:8px;font-size:13px;color:#d9d9d9;}
  .topbar .fig-icon{width:20px;height:20px;flex-shrink:0;}
  .topbar .filename{font-weight:600;color:#fff;}
  .topbar .filename small{color:#9c9c9c;font-weight:400;margin-left:6px;}
  .topbar .spacer{flex:1;}
  .avatars{display:flex;margin-right:6px;}
  .avatars span{
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#fff;border:2px solid var(--figma-bar);margin-left:-8px;
  }
  .btn-present{
    background:var(--figma-purple);color:#fff;border:none;border-radius:6px;padding:7px 14px;
    font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;
    font-family:var(--font-ui);
  }
  .btn-present:hover{background:#8e3ff0;}
  .btn-share{background:#3d3d3d;color:#fff;border:none;border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-ui);}

  /* ===== BODY LAYOUT ===== */
  .body-wrap{display:flex;height:calc(100vh - 48px);}

  /* ===== SIDEBAR ===== */
  .sidebar{
    width:232px;background:var(--figma-panel);border-right:1px solid var(--figma-border);
    display:flex;flex-direction:column;flex-shrink:0;
  }
  .sidebar-tabs{display:flex;font-size:11px;color:var(--figma-text-dim);padding:10px 14px 6px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
  .layer-list{overflow-y:auto;padding:2px 6px 20px;flex:1;}
  .layer-item{
    display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px;cursor:pointer;
    font-size:12.5px;color:var(--figma-text);
  }
  .layer-item:hover{background:#f4f0ff;}
  .layer-item.active{background:#f0e6ff;color:var(--figma-purple);font-weight:600;}
  .layer-item .fnum{
    width:18px;height:18px;border-radius:4px;background:#efefef;color:#8c8c8c;font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .layer-item.active .fnum{background:var(--figma-purple);color:#fff;}
  .sidebar-foot{
    border-top:1px solid var(--figma-border);padding:12px 14px;font-size:11px;color:var(--figma-text-dim);
    line-height:1.5;
  }

  /* ===== CANVAS ===== */
  .canvas-wrap{flex:1;position:relative;overflow:auto;background:var(--figma-canvas);}
  .canvas-wrap{
    background-image:radial-gradient(circle,#cfcfcf 1px,transparent 1px);
    background-size:22px 22px;
  }
  .canvas-inner{position:relative;}
  svg.connectors{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}
  .frame-block{position:absolute;}
  .frame-label{
    font-size:12px;color:#6b6b6b;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;
  }
  .frame-label .badge{
    background:#fff;border:1px solid var(--figma-border);color:var(--figma-purple);
    font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;
  }
  .frame-outer{
    background:#fff;border-radius:34px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 12px 28px rgba(0,0,0,.10);
    border:8px solid #1b1b1b;width:260px;height:562px;position:relative;overflow:hidden;
    cursor:pointer;transition:box-shadow .15s, transform .15s;
  }
  .frame-outer:hover{box-shadow:0 0 0 3px var(--figma-purple),0 12px 28px rgba(0,0,0,.18);}
  .frame-outer.selected{box-shadow:0 0 0 3px var(--figma-blue),0 12px 28px rgba(0,0,0,.18);}
  .notch{
    position:absolute;top:0;left:50%;transform:translateX(-50%);width:110px;height:20px;
    background:#1b1b1b;border-radius:0 0 14px 14px;z-index:30;
  }
  .screen{position:absolute;inset:0;background:#fff;font-family:var(--font-app);}

  /* ===== STATUS BAR ===== */
  .status{
    height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
    font-size:11px;font-weight:600;color:#1b1b1b;position:relative;z-index:20;
  }
  .status.on-dark{color:#fff;}

  /* ===== WA APP CHROME ===== */
  .wa-header{
    background:var(--wa-teal);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;
  }
  .wa-header .avatar{width:32px;height:32px;border-radius:50%;background:#0aa;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .wa-header .titles{flex:1;min-width:0;}
  .wa-header .titles .t1{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wa-header .titles .t2{font-size:10px;opacity:.8;}
  .wa-header .icon{width:16px;height:16px;opacity:.9;}
  .wa-body{padding:14px;font-size:12px;color:#222;overflow-y:auto;height:calc(100% - 26px - 52px);}
  .wa-body::-webkit-scrollbar{width:0;}

  /* generic content styles */
  .h1{font-size:16px;font-weight:800;color:#1b1b1b;margin:0 0 4px;font-family:var(--font-app);}
  .h2{font-size:12.5px;font-weight:600;color:#444;margin:0 0 12px;line-height:1.5;}
  .muted{color:#8a8a8a;font-size:11px;}
  .card{background:#f7f7f8;border:1px solid #ececec;border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:10.5px;font-weight:700;color:#666;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
  .field .value{border:1px solid #e2e2e2;border-radius:8px;padding:8px 10px;font-size:12px;color:#222;background:#fff;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;
    background:var(--wa-green);color:#03422f;font-weight:700;font-size:12.5px;padding:11px;border-radius:9px;
    border:none;cursor:pointer;font-family:var(--font-app);
  }
  .btn.dark{background:var(--wa-teal);color:#fff;}
  .btn.ghost{background:transparent;color:var(--wa-teal);font-weight:700;border:1.5px solid var(--wa-teal);}
  .btn.small{width:auto;padding:8px 14px;font-size:11.5px;}
  .row{display:flex;align-items:center;justify-content:space-between;}
  .toggle{width:38px;height:22px;border-radius:20px;background:#ccc;position:relative;flex-shrink:0;cursor:pointer;transition:.2s;}
  .toggle.on{background:var(--wa-green);}
  .toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3);}
  .toggle.on .knob{left:18px;}
  .chip{display:inline-flex;align-items:center;gap:5px;background:#eef7f0;color:#0a7a49;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;}
  .menu-item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #f0f0f0;}
  .menu-item .ic{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:15px;flex-shrink:0;
  }
  .menu-item .txt .t1{font-size:12.5px;font-weight:700;color:#222;}
  .menu-item .txt .t2{font-size:10px;color:#999;}
  .chevron{margin-left:auto;color:#c7c7c7;font-size:14px;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .label-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f2f2f2;}
  .label-row .cnt{margin-left:auto;font-size:11px;color:#999;font-weight:700;}
  .qr-box{
    width:118px;height:118px;margin:14px auto;border-radius:10px;
    background:
      linear-gradient(90deg,#1b1b1b 22%,transparent 0) 0 0/22% 100%,
      repeating-linear-gradient(90deg,#1b1b1b 0 6px,#fff 6px 12px);
    background-color:#fff;border:1px solid #eee;position:relative;
  }
  .cover-shape{position:absolute;border-radius:50%;opacity:.5;}
  .stat-chip{background:#fff;border:1px solid #eaeaea;border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.04);}
  .stat-chip .num{font-size:17px;font-weight:800;color:var(--wa-teal);font-family:var(--font-app);}
  .stat-chip .lbl{font-size:10.5px;color:#777;}
  .checklist-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;color:#333;}
  .checkmark{width:18px;height:18px;border-radius:50%;background:var(--wa-green);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* chat bubbles */
  .bubble{max-width:78%;padding:8px 10px;border-radius:9px;font-size:11.5px;margin-bottom:8px;line-height:1.4;position:relative;}
  .bubble.in{background:#fff;border:1px solid #eee;}
  .bubble.out{background:var(--wa-bubble);margin-left:auto;}
  .bubble .time{display:block;font-size:9px;color:#999;text-align:right;margin-top:3px;}
  .chat-bg{background:var(--wa-wallpaper);background-image:radial-gradient(#d8c9ac 1px,transparent 1px);background-size:14px 14px;}

  /* ===== PRESENT MODE ===== */
  .present-overlay{
    position:fixed;inset:0;background:#1b1b1b;z-index:200;display:none;
    align-items:center;justify-content:center;flex-direction:column;
  }
  .present-overlay.show{display:flex;}
  .present-topbar{
    position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;
    justify-content:space-between;padding:0 18px;color:#ccc;font-size:12px;
  }
  .present-close{background:#333;border:none;color:#fff;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:15px;}
  .present-stage{position:relative;display:flex;align-items:center;gap:26px;}
  .nav-btn{
    width:42px;height:42px;border-radius:50%;background:#2d2d2d;border:1px solid #444;color:#fff;
    font-size:18px;cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.25;cursor:default;}
  .present-frame{width:300px;height:648px;transform:scale(1);}
  .present-caption{color:#aaa;font-size:12px;margin-top:16px;letter-spacing:.3px;}
  .dots{display:flex;gap:6px;margin-top:10px;}
  .dots span{width:6px;height:6px;border-radius:50%;background:#555;}
  .dots span.on{background:var(--figma-purple);width:16px;border-radius:4px;}

  /* fake multiplayer cursors */
  .mp-cursor{position:absolute;z-index:40;pointer-events:none;display:flex;align-items:center;gap:5px;
    animation:float1 14s ease-in-out infinite;}
  .mp-cursor svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
  .mp-cursor .tag{background:var(--figma-purple);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:0 6px 6px 6px;white-space:nowrap;}
  .mp-cursor.c2{animation:float2 18s ease-in-out infinite;}
  .mp-cursor.c2 .tag{background:#f24822;}
  @keyframes float1{
    0%{transform:translate(0,0);} 20%{transform:translate(420px,140px);} 45%{transform:translate(900px,60px);}
    65%{transform:translate(1250px,520px);} 85%{transform:translate(600px,600px);} 100%{transform:translate(0,0);}
  }
  @keyframes float2{
    0%{transform:translate(1400px,50px);} 25%{transform:translate(950px,480px);} 50%{transform:translate(480px,300px);}
    75%{transform:translate(120px,560px);} 100%{transform:translate(1400px,50px);}
  }
  @media (prefers-reduced-motion: reduce){ .mp-cursor{animation:none!important;} }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg class="fig-icon" viewBox="0 0 38 57" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0Z" fill="#1abcfe"/>
      <path d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0Z" fill="#0acf83"/>
      <path d="M19 0v19h9.5a9.5 9.5 0 1 0 0-19H19Z" fill="#ff7262"/>
      <path d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5Z" fill="#f24e1e"/>
      <path d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5Z" fill="#a259ff"/>
    </svg>
    <span class="filename">WA Business UMKM — Desa Betiting <small>Diadaptasi dari materi edukasi KKN</small></span>
  </div>
  <div class="spacer"></div>
  <div class="avatars">
    <span style="background:#a259ff;">V</span>
    <span style="background:#f24822;">K</span>
  </div>

  <button class="btn-present" id="presentBtn">▶ Present</button>
</div>

<div class="body-wrap">
  <div class="sidebar">
    <div class="sidebar-tabs">Pages / Frames</div>
    <div class="layer-list" id="layerList"></div>
    <div class="sidebar-foot">
      16 frame · Alur linear · Klik salah satu layar atau tekan <b>Present</b> untuk mencoba prototype secara berurutan seperti demo Figma.
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <div class="canvas-inner" id="canvasInner">
      <svg class="connectors" id="connectors"></svg>
      <!-- frames injected by JS -->
    </div>
    <div class="mp-cursor" style="top:0;left:0;">
      <svg width="18" height="22" viewBox="0 0 18 22"><path d="M1 1l5 18 3-7 7-3z" fill="#a259ff" stroke="#fff" stroke-width="1"/></svg>
      <span class="tag">Vivi</span>
    </div>
    <div class="mp-cursor c2" style="top:0;left:0;">
      <svg width="18" height="22" viewBox="0 0 18 22"><path d="M1 1l5 18 3-7 7-3z" fill="#f24822" stroke="#fff" stroke-width="1"/></svg>
      <span class="tag">Tim KKN</span>
    </div>
  </div>
</div>

<div class="present-overlay" id="presentOverlay">
  <div class="present-topbar">
    <span id="presentTitle">01 · Cover</span>
    <button class="present-close" id="presentClose">✕</button>
  </div>
  <div class="present-stage">
    <button class="nav-btn" id="prevBtn">‹</button>
    <div class="present-frame" id="presentFrame"></div>
    <button class="nav-btn" id="nextBtn">›</button>
  </div>
  <div class="dots" id="presentDots"></div>
</div>

<script>
/* ---------- STATUS BAR HELPERS ---------- */
function statusBar(dark){
  return `<div class="status ${dark?'on-dark':''}">
    <span>09:41</span>
    <span>●●●&nbsp; 📶 🔋</span>
  </div>`;
}
function waHeader(title, sub){
  return `<div class="wa-header">
    <div class="avatar">☕</div>
    <div class="titles"><div class="t1">${title}</div><div class="t2">${sub}</div></div>
  </div>`;
}

/* ---------- FRAME CONTENT DEFINITIONS ---------- */
const frames = [
{ id:1, name:"Cover", content:`
  <div style="height:100%;background:linear-gradient(160deg,#075e54,#0a8a72);position:relative;overflow:hidden;">
    <div class="cover-shape" style="width:180px;height:180px;background:#25d366;top:-60px;left:-60px;"></div>
    <div class="cover-shape" style="width:140px;height:140px;background:#fff;opacity:.08;bottom:40px;right:-40px;"></div>
    ${statusBar(true)}
    <div style="padding:34px 22px;color:#fff;position:relative;z-index:2;">
      <div class="chip" style="background:rgba(255,255,255,.18);color:#fff;margin-bottom:26px;">KKN DESA BETITING</div>
      <div style="font-family:var(--font-app);font-weight:800;font-size:24px;line-height:1.25;">Strategi Jualan<br>Lewat <span style="color:#8fff9e;">WhatsApp<br>Business</span></div>
      <div style="font-size:12px;opacity:.85;margin-top:10px;">di era digital saat ini</div>
    </div>
    <div style="position:absolute;bottom:26px;left:22px;right:22px;">
      <button class="btn" onclick="goNext()">Mulai Belajar →</button>
    </div>
  </div>`},

{ id:2, name:"Kenapa WA Business?", content:`
  ${statusBar(false)}
  <div class="wa-body" style="height:calc(100% - 26px);">
    <div class="h1">Kenapa WhatsApp Business?</div>
    <div class="h2">Channel jualan paling dekat dengan pelanggan UMKM di Desa Betiting.</div>
    <div class="stat-chip"><div class="num">98,9%</div><div class="lbl">pengguna internet Indonesia memakai WhatsApp</div></div>
    <div class="stat-chip"><div class="num">±40%</div><div class="lbl">membuka WhatsApp lebih dari 5 jam setiap hari</div></div>
    <div class="stat-chip"><div class="num">Gratis</div><div class="lbl">dirancang khusus untuk kebutuhan bisnis kecil</div></div>
    <div style="margin-top:16px;"><button class="btn" onclick="goNext()">Lanjut</button></div>
  </div>`},

{ id:3, name:"Unduh & Setujui", content:`
  ${statusBar(false)}
  <div class="wa-body" style="text-align:center;height:calc(100% - 26px);">
    <div style="font-size:15px;font-weight:800;color:var(--wa-green);margin-top:6px;">WhatsApp Business</div>
    <div class="muted" style="margin:6px 0 26px;">An easy tool for businesses to<br>communicate with their customers</div>
    <div style="width:120px;height:120px;margin:0 auto 26px;border-radius:50%;background:#eafaf0;display:flex;align-items:center;justify-content:center;font-size:46px;">💬</div>
    <div class="muted" style="margin-bottom:16px;">Dengan melanjutkan, kamu menyetujui Ketentuan Layanan &amp; Kebijakan Privasi WhatsApp.</div>
  </div>
  <div style="position:absolute;bottom:16px;left:16px;right:16px;">
    <button class="btn" onclick="goNext()">SETUJU DAN LANJUTKAN</button>
    <div class="muted" style="text-align:center;margin-top:10px;">BUKAN AKUN BISNIS</div>
  </div>`},

{ id:4, name:"Verifikasi Nomor", content:`
  ${statusBar(false)}
  <div class="wa-body" style="height:calc(100% - 26px);">
    <div class="h1">Verifikasi nomor ponsel</div>
    <div class="h2">Masukkan nomor WhatsApp toko kamu. Kode OTP akan dikirim lewat SMS.</div>
    <div class="field"><label>Negara</label><div class="value">Indonesia</div></div>
    <div class="field"><label>Nomor Ponsel</label><div class="value">+62 &nbsp; 812-3456-7890</div></div>
    <button class="btn" onclick="goNext()">LANJUT</button>
    <div class="muted" style="margin-top:10px;">Biaya SMS mengikuti tarif operator.</div>
  </div>`},

{ id:5, name:"Nama Bisnis", content:`
  ${statusBar(false)}
  <div class="wa-body" style="height:calc(100% - 26px);">
    <div class="h1">Beri nama toko kamu</div>
    <div class="h2">Nama ini akan tampil ke pelanggan dan tidak bisa diganti setelah disimpan.</div>
    <div class="field"><label>Nama Bisnis</label><div class="value" style="font-weight:700;">Kopi Betiting</div></div>
    <button class="btn" onclick="goNext()">SELESAI, BUAT TOKO</button>
  </div>`},

{ id:6, name:"Dashboard Toko", content:`
  ${waHeader("Kopi Betiting","Akun bisnis · online")}
  <div class="wa-body" style="height:calc(100% - 26px - 52px);">
    <div class="menu-item"><div class="ic" style="background:#e7f5ff;">👤</div><div class="txt"><div class="t1">Profil Bisnis</div><div class="t2">Lengkapi info toko</div></div><div class="chevron" onclick="jumpTo(6)">›</div></div>
    <div class="menu-item"><div class="ic" style="background:#fff4e0;">🗂️</div><div class="txt"><div class="t1">Katalog</div><div class="t2">4 produk</div></div><div class="chevron" onclick="jumpTo(7)">›</div></div>

/* ---------- SNAKE GRID LAYOUT ---------- */
const COLS=4, FW=260, FH=562, GAPX=170, GAPY=210, LABEL_H=26, PAD=60;
const cellW=FW+GAPX, cellH=FH+GAPY+LABEL_H;
function frameXY(i){
  const row=Math.floor(i/COLS);
  let col=i%COLS;
  if(row%2===1) col=COLS-1-col;
  return {x:PAD+col*cellW, y:PAD+row*cellH, row, col};
}

const canvasInner=document.getElementById('canvasInner');
const layerList=document.getElementById('layerList');
const svg=document.getElementById('connectors');

frames.forEach((f,i)=>{
  const {x,y}=frameXY(i);
  const block=document.createElement('div');
  block.className='frame-block';
  block.style.left=x+'px';
  block.style.top=y+'px';
  block.innerHTML=`
    <div class="frame-label"><span class="badge">${String(i+1).padStart(2,'0')}</span> ${f.name}</div>
    <div class="frame-outer" id="frameOuter${i}" onclick="jumpTo(${i})">
      <div class="notch"></div>
      <div class="screen">${f.content}</div>
    </div>`;
  canvasInner.appendChild(block);

  const li=document.createElement('div');
  li.className='layer-item';
  li.id='layer'+i;
  li.innerHTML=`<span class="fnum">${i+1}</span> ${f.name}`;
  li.onclick=()=>{ jumpTo(i); document.getElementById('frameOuter'+i).scrollIntoView({behavior:'smooth',block:'center',inline:'center'}); };
  layerList.appendChild(li);
});

/* size canvas + draw connectors */
const lastRow=Math.floor((frames.length-1)/COLS);
canvasInner.style.width=(PAD*2+COLS*cellW)+'px';
canvasInner.style.height=(PAD*2+(lastRow+1)*cellH)+'px';
svg.setAttribute('width',canvasInner.style.width);
svg.setAttribute('height',canvasInner.style.height);
svg.innerHTML=`<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
  <path d="M0,0 L6,3 L0,6 Z" fill="#0d99ff"/></marker></defs>`;

function frameEdge(i,side){
  const {x,y}=frameXY(i);
  const cy=y+LABEL_H+FH/2;
  return side==='right' ? {px:x+FW,py:cy} : side==='left' ? {px:x,py:cy} : side==='bottom' ? {px:x+FW/2,py:y+LABEL_H+FH} : {px:x+FW/2,py:y+LABEL_H};
}
for(let i=0;i<frames.length-1;i++){
  const row=Math.floor(i/COLS);
  const isRowEnd = (i%COLS===COLS-1);
  let p1,p2,path;
  if(!isRowEnd){
    const goingRight = row%2===0;
    p1=frameEdge(i, goingRight?'right':'left');
    p2=frameEdge(i+1, goingRight?'left':'right');
    path=`M${p1.px},${p1.py} L${p2.px},${p2.py}`;
  }else{
    p1=frameEdge(i,'bottom');
    p2=frameEdge(i+1,'top');
    const midY=(p1.py+p2.py)/2;
    path=`M${p1.px},${p1.py} C${p1.px},${midY} ${p2.px},${midY} ${p2.px},${p2.py}`;
  }
  const el=document.createElementNS('http://www.w3.org/2000/svg','path');
  el.setAttribute('d',path);
  el.setAttribute('stroke','#0d99ff');
  el.setAttribute('stroke-width','2');
  el.setAttribute('fill','none');
  el.setAttribute('marker-end','url(#arrow)');
  el.setAttribute('opacity','0.55');
  svg.appendChild(el);
}

/* ---------- SELECTION / NAVIGATION ---------- */
let current=0;
function setActive(i){
  frames.forEach((_,k)=>{
    document.getElementById('frameOuter'+k).classList.toggle('selected',k===i);
    document.getElementById('layer'+k).classList.toggle('active',k===i);
  });
  current=i;
}
function jumpTo(i){
  setActive(i);
  if(overlay.classList.contains('show')){ presentIndex=i; renderPresent(); }
}
function goNext(){
  if(document.getElementById('presentOverlay').classList.contains('show')){
    presentIndex=Math.min(presentIndex+1, frames.length-1);
    renderPresent();
  } else {
    const next=Math.min(current+1, frames.length-1);
    setActive(next);
    document.getElementById('frameOuter'+next).scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
  }
}
setActive(0);

/* ---------- PRESENT MODE ---------- */
const overlay=document.getElementById('presentOverlay');
const presentFrame=document.getElementById('presentFrame');
const presentTitle=document.getElementById('presentTitle');
const presentDots=document.getElementById('presentDots');
let presentIndex=0;

function renderPresent(){
  const f=frames[presentIndex];
  presentFrame.innerHTML=`<div class="frame-outer" style="width:300px;height:648px;">
      <div class="notch"></div><div class="screen">${f.content}</div>
    </div>`;
  presentTitle.textContent=`${String(presentIndex+1).padStart(2,'0')} · ${f.name}`;
  document.getElementById('prevBtn').disabled = presentIndex===0;
  document.getElementById('nextBtn').disabled = presentIndex===frames.length-1;
  presentDots.innerHTML = frames.map((_,i)=>`<span class="${i===presentIndex?'on':''}"></span>`).join('');
  setActive(presentIndex);
}
document.getElementById('presentBtn').onclick=()=>{ presentIndex=current; overlay.classList.add('show'); renderPresent(); };
document.getElementById('presentClose').onclick=()=>overlay.classList.remove('show');
document.getElementById('prevBtn').onclick=()=>{ presentIndex=Math.max(0,presentIndex-1); renderPresent(); };
document.getElementById('nextBtn').onclick=()=>{ presentIndex=Math.min(frames.length-1,presentIndex+1); renderPresent(); };
document.addEventListener('keydown',(e)=>{
  if(!overlay.classList.contains('show')) return;
  if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
  if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key==='Escape') overlay.classList.remove('show');
});
</script>
